name: Stage AI release for Central validation
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact aiVersion from the reviewed main commit
        required: true
permissions:
  contents: read
  actions: read
jobs:
  stage:
    runs-on: macos-15
    environment: release
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require reviewed main commit and green CI
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$REQUESTED_VERSION" = "$(sed -n 's/^aiVersion=//p' gradle.properties)"
          test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$GITHUB_SHA"
          gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json conclusion --jq 'any(.[]; .conclusion == "success")' | grep -qx true
      - name: Build signed local release
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY"
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          ./gradlew --no-daemon :neton-ai:checkKotlinAbi :neton-ai:macosArm64Test :neton-ai:publishAllPublicationsToStagingLocalRepository
          python3 tools/bundle_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: signed-ai-${{ inputs.version }}-${{ github.sha }}
          path: |
            build/central-bundle.zip
            build/release-manifest.json
      - name: Submit for Central validation only
        env:
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          test -n "$CENTRAL_TOKEN"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CENTRAL_TOKEN" \
            -F bundle=@build/central-bundle.zip \
            'https://central.sonatype.com/api/v1/publisher/upload?publishingType=USER_MANAGED' \
            > build/central-deployment-id.txt
      - uses: actions/upload-artifact@v4
        with:
          name: central-deployment-${{ github.sha }}
          path: build/central-deployment-id.txt
